name: Antigravity CI — 品質ゲート

# 2026-07-25 改訂:
#   旧設定は on.push.branches が [main, develop] のみで feature/* では発火せず、
#   実行履歴は 2026-01-29 の1件だけだった（その間に約2,120コミット）。
#   さらに `|| true` と `continue-on-error` により発火しても必ず緑になっていた。
#   ゲートとして機能するよう、発火条件を広げ、握り潰しを除去した。
#
# 2026-08-01 改訂: 作業ブランチを push トリガーから外した。
#   上の改訂で 'feature/**' と 'cc/**' を足したが、当時と違って作業は必ず
#   PR を通すようになったため、**同一コミットに対して push と pull_request で
#   CI が2本走っていた**（1本 22分）。実測では PR 1本のマージに 3〜4 本分の
#   CI が費やされていた（strict なブランチ保護で BEHIND になるたび回り直すため）。
#
#   push 側の実行はもともと「参考表示」で、マージゲートは
#   `continue-on-error: github.event_name != 'pull_request'` により
#   PR のときだけ効く設計だった。つまり push 側の1本は PR 側の完全な重複。
#
#   PR を開いていない作業ブランチでは CI が回らなくなるが、
#   回したいときは draft PR を開けばよい。
#
#   併せて concurrency を入れ、同じ PR へ続けて push したときは
#   古い実行を打ち切る。main は打ち切らない（マージ後の検証を欠かさないため）。

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # テスト中の自動 Git コミットを抑止する。
  # submit_batch_report の自動計装は `git add -A` + `git commit` を実行するため、
  # 抑止しないと CI が勝手にコミットする（2026-07-25 にローカルで3件発生）。
  ANTIGRAVITY_DISABLE_AUTO_COMMIT: "1"

jobs:
  test:
    name: Python テストスイート
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 2026-07-25: CI 初回実行で判明した不足。ローカル(Windows)では既に導入済み
      # だったため、CI を回して初めて露見した。
      #   - ffmpeg: 動画処理テスト（FileNotFoundError: 'ffmpeg'）
      #   - フォント: テロップ描画テスト（OSError: Failed to load any premium fonts）
      - name: システム依存インストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core

      - name: 依存関係インストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 構文チェック（全 .py ファイル）
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errors = []
          for root in ("backend", "tests"):
              for f in pathlib.Path(root).rglob("*.py"):
                  try:
                      ast.parse(f.read_text(encoding="utf-8"))
                  except SyntaxError as e:
                      errors.append(f"{f}: {e}")
          if errors:
              print("Syntax Errors:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print("All files passed syntax check")
          PY

      # testpaths を広げるたびに踏むため機械化した。
      # ディレクトリ単独では通り、全体実行のときだけ壊れるので気付きにくい。
      - name: テストモジュール名の衝突チェック
        run: python scripts/check_test_module_collisions.py

      # 1プロセスで約10,000テストを走らせるとランナーのメモリを使い切り、
      # 全体の20%地点で OOM Killer に殺された（exit 137）。
      # バッチごとに別プロセスで実行してメモリを解放する。
      # カバレッジは --cov-append で積算し、JUnit XML は結合するため判定材料は同じ。
      #
      # 分割数は 8。4 だと最初のバッチ（約2,150件）がまだメモリで落ち、そのバッチ分の
      # カバレッジが丸ごと欠けて 64.9% と実態より低く出た（テストの失敗は 0 件）。
      # 手元(Windows)で 8 にすると一時ファイルの掴み合いで PermissionError が出るため、
      # ローカル実行は既定の 4 のままでよい（scripts/run_test_batches.py の既定値）。
      - name: テストスイート実行（pytest.ini の testpaths / バッチ分割）
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
          PYTHONPATH: ./backend
        run: |
          python scripts/run_test_batches.py --batches 8 \
            --junit test-results.xml \
            --coverage coverage.json

      # CI(Linux) でのみ失敗するテストの原因特定用。ローカル(Windows)では
      # 再現できないため、実際の解決先・実ログを Linux 上で出力させる。
      # 原因が出揃ったら、このステップとスクリプトは削除してよい。
      - name: Linux 固有失敗の診断
        if: always()
        continue-on-error: true
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
          PYTHONPATH: ./backend
        run: python scripts/diagnose_linux_failures.py

      # 診断で「Linux でも patch は正常に効く」ことが判明したため、
      # chaos の失敗はプラットフォーム差ではなくテスト間汚染の疑いが強い。
      # 単独実行して切り分ける（単独で通れば汚染、落ちれば真の環境差）。
      # 単独実行では 56 passed、全体実行でのみ10件失敗することを確認済み。
      # → プラットフォーム差ではなくテスト間汚染。汚染源を CI 上で二分探索する。
      - name: chaos 汚染源の二分探索
        if: always()
        continue-on-error: true
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
          PYTHONPATH: ./backend
        run: python scripts/bisect_chaos_pollution.py

      # テストが本番ファイルを書き換えるのを増やさないためのゲート。
      # 静的解析ではできない（書き込み先は実行時にしか分からない）ので、
      # 上のテスト実行が出した実測 fs-guard-records.jsonl を判定する。
      # 失敗しても他のステップの結果を隠さないよう always() で回す。
      #
      # ベースライン（.github/fs-guard-baseline.json）は **CI(Linux) の実測**で
      # 作った。手元(Windows)とは通る経路が違い、Linux でだけ出る汚染がある
      # （`C:/dummy/...` のような偽の Windows パスは Linux では相対パスとして
      # 解決され、リポジトリ内にディレクトリが実際に作られる）。
      - name: 本番ファイル汚染ラチェット（増加を許さない）
        if: always()
        run: python .github/scripts/fs_guard_ratchet.py

      # UX 検証 L1（DOM存在）の非退行ゲート。判定は frontend ソースの静的走査
      # だけなので、ブラウザもサーバも要らず課金も発生しない。
      # 集計値ではなく **項目ごと** に突き合わせる（PASS 数が同じまま中身が
      # 入れ替わる退行を、集計値では検出できない）。
      #
      # 固定するのは3層。verdict（PASS が FAIL に戻らない）／判定理由（内容を
      # 見ていた項目が経路の実在だけに戻らない）／**宣言内容**（項目が何を測ると
      # 言っているか）。3層目が無いと、`response_field` を実在する別の
      # フィールドに差し替えるだけで FAIL が PASS になり、違反ゼロ・改善1件として
      # 通る（P3 C-4 / gate-verifier 5回目）。
      - name: UX 検証 L1 ラチェット（PASS の後退・判定の弱化・宣言の差し替えを許さない）
        if: always()
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
        run: python -m backend.ux_verification.executor --persona owner --ratchet

      # 主張と判定手段の対応。ここが崩れると、判定していないものが PASS になる。
      # P2 では走査範囲を人間が description を読んで決めていたため、3回の独立検証で
      # 3回とも数え漏れが出た。新しい項目に claim を書き忘れれば no_claim で落ちる。
      - name: 主張と判定手段の対応ゲート（判定していないものを PASS にしない）
        if: always()
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
        run: python -m backend.ux_verification.claim_audit --persona owner --gate

      # 死蔵コード（include_router されていないエンドポイント・エントリから
      # import を辿れないファイル）を増やさせない。テストが通ることは到達可能で
      # あることを意味しない——review_router は 21件のテストが緑のまま本番では
      # 404 を返している。カバレッジでは検出できないので独立したゲートを置く。
      - name: 死蔵コードラチェット（増加を許さない）
        if: always()
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
        run: python -m backend.ux_verification.dead_code --ratchet

      - name: テスト結果アップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.json
            fs-guard-records.jsonl
            fs-guard-report.txt
          retention-days: 30

      # main へのマージ可否は「マージするとき」に判定する。
      # 作業ブランチへの push では参考表示にとどめ、PR では必須ゲートにする。
      - name: main マージゲート判定
        if: always()
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          python scripts/check_merge_gate.py \
            --junit test-results.xml \
            --coverage coverage.json

  lint:
    name: コード品質ラチェット
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: リンターインストール
        run: pip install ruff

      # 一括ゼロ化は非現実的（2026-07-25 実測 28,987件、うち 27,526 件は W293）。
      # 既存の UX ラチェット / TDR ラチェットと同じ方式で「増やさない」ことを保証する。
      - name: Ruff ラチェット（違反数の非増加を保証）
        run: python .github/scripts/ruff_ratchet.py

      # 集約モジュール（path_resolver / font_resolver）を作るだけでは新規流入は
      # 止まらない。font_resolver を 2026-07-25 に作った後も C:\Windows\Fonts の
      # 直書きは減らず、2026-07-28 時点で 159 行残っていた。
      #
      # ユーザーホーム配下（本番 0 件）とフォントディレクトリ（本番 136 件）は
      # 別の分類として数える。合計だけを見ていると、片方を減らしたぶんで
      # もう片方の増加を相殺できてしまう。
      - name: 絶対パス直書きラチェット（増加を許さない）
        run: python .github/scripts/abspath_ratchet.py

  security:
    name: シークレットスキャン
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 旧実装は *.py のみを走査していたため、実際に混入していた GitHub PAT
      # （.ps1 2ファイル + .git/config 2箇所）を検出できなかった。
      # 全テキストファイルを対象にし、検出時は警告ではなく失敗させる。
      - name: 全ファイル走査
        run: python .github/scripts/secret_scan.py
