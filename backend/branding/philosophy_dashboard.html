<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哲学ダッシュボード | Soul Narrative</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(90deg, #60efff, #00ff87);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 10px;
        }
        
        .integrated-philosophy {
            background: linear-gradient(135deg, rgba(0,255,135,0.2), rgba(96,239,255,0.2));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            border: 2px solid rgba(0,255,135,0.3);
        }
        
        .integrated-philosophy h2 {
            font-size: 1.2rem;
            color: #60efff;
            margin-bottom: 15px;
        }
        
        .integrated-philosophy .philosophy-text {
            font-size: 1.5rem;
            font-style: italic;
            line-height: 1.6;
        }
        
        .tags-section {
            margin-bottom: 40px;
        }
        
        .tags-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #60efff;
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .tag {
            background: rgba(0,255,135,0.2);
            border: 1px solid rgba(0,255,135,0.5);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        .tag-count {
            background: rgba(96,239,255,0.3);
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 8px;
            font-size: 0.8rem;
        }
        
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, #00ff87, #60efff);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border-left: 3px solid #00ff87;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 25px;
            width: 12px;
            height: 12px;
            background: #00ff87;
            border-radius: 50%;
            border: 2px solid #1a1a2e;
        }
        
        .timeline-number {
            position: absolute;
            left: -45px;
            top: 20px;
            font-size: 0.8rem;
            color: #60efff;
        }
        
        .timeline-philosophy {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 10px;
        }
        
        .timeline-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #888;
        }
        
        .timeline-tags {
            display: flex;
            gap: 5px;
        }
        
        .timeline-tag {
            background: rgba(96,239,255,0.2);
            border-radius: 10px;
            padding: 3px 10px;
            font-size: 0.75rem;
        }
        
        .search-box {
            margin-bottom: 30px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        
        .search-box input::placeholder {
            color: #888;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #00ff87;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 哲学ダッシュボード</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">2</div>
                <div class="stat-label">累積哲学数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">1</div>
                <div class="stat-label">セッション数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">2</div>
                <div class="stat-label">テーマ数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">1</div>
                <div class="stat-label">統合回数</div>
            </div>
        </div>
        
        
        <div class="integrated-philosophy">
            <h2>🎯 統合哲学（Soul Narrative）</h2>
            <div class="philosophy-text">究極の統合哲学</div>
        </div>
        
        
        <div class="tags-section">
            <h2>📊 テーマ別統計</h2>
            <div class="tags-container">
                <span class="tag">技術<span class="tag-count">1</span></span><span class="tag">協調<span class="tag-count">1</span></span>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="🔍 哲学を検索..." onkeyup="filterTimeline()">
        </div>
        
        <h2 style="color: #60efff; margin-bottom: 20px;">📜 哲学タイムライン</h2>
        
        <div class="timeline" id="timeline">
            
            <div class="timeline-item" data-philosophy="チーム協調の重視" data-tags="協調">
                <span class="timeline-number">#2</span>
                <div class="timeline-philosophy">「チーム協調の重視」</div>
                <div class="timeline-meta">
                    <span>2026-01-02</span>
                    <div class="timeline-tags">
                        <span class="timeline-tag">協調</span>
                    </div>
                </div>
            </div>
            
            <div class="timeline-item" data-philosophy="技術的なシステム自動化の追求" data-tags="技術">
                <span class="timeline-number">#1</span>
                <div class="timeline-philosophy">「技術的なシステム自動化の追求」</div>
                <div class="timeline-meta">
                    <span>2026-01-01</span>
                    <div class="timeline-tags">
                        <span class="timeline-tag">技術</span>
                    </div>
                </div>
            </div>
            
        </div>
        
        <footer>
            Northern Light 2.0 - Soul Narrative | Generated: 2026-06-27 13:37:27
        </footer>
    </div>
    
    <script>
        function filterTimeline() {
            const query = document.getElementById('search').value.toLowerCase();
            const items = document.querySelectorAll('.timeline-item');
            
            items.forEach(item => {
                const philosophy = item.getAttribute('data-philosophy');
                const tags = item.getAttribute('data-tags');
                
                if (philosophy.includes(query) || tags.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
